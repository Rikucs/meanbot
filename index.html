<!DOCTYPE html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-g" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeanBot - Chat com IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0"
  }
}
</script>
<style>
  @keyframes fade-in-slide-up {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fade-in-slide-up {
    animation: fade-in-slide-up 0.3s ease-out forwards;
  }

  @keyframes pulse-bar {
    0%, 100% {
      transform: scaleY(0.4);
      opacity: 0.5;
    }
    50% {
      transform: scaleY(1);
      opacity: 1;
    }
  }

  .animate-pulse-bar {
    animation: pulse-bar 1.2s infinite ease-in-out;
  }

  .chat-background {
    background-color: #111827; /* bg-gray-900 */
    background-image: radial-gradient(#374151, transparent 1px);
    background-size: 24px 24px;
  }

  /* Estilização da barra de scroll para browsers WebKit */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background-color: #1f2937; /* bg-gray-800 */
  }
  ::-webkit-scrollbar-thumb {
    background-color: #4b5563; /* bg-gray-600 */
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: #6b7280; /* bg-gray-500 */
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
